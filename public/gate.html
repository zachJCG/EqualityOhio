<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Preview Access — Equality Ohio</title>
    <meta name="description" content="Password-protected design preview." />
    <meta name="theme-color" content="#5A3F99" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='95' fill='%230093D0'/%3E%3Crect x='55' y='78' width='90' height='16' fill='white'/%3E%3Crect x='55' y='108' width='90' height='16' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/eo-fonts.css" />
    <link rel="stylesheet" href="/css/eo-site.css" />
    <style>
      .gate-wrap {
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0; padding: 2rem 1.5rem;
        background:
          radial-gradient(56vw 56vw at 112% -18%, rgba(0, 128, 192, 0.10), transparent 62%),
          radial-gradient(48vw 48vw at -14% 118%, rgba(106, 202, 62, 0.10), transparent 60%),
          var(--eo-bg);
      }
      .gate-card { max-width: 420px; width: 100%; text-align: center; }
      .gate-card .brand-lockup { justify-content: center; margin-bottom: 1.4rem; }
      .gate-card .brand-lockup__mark { width: 72px; height: 36px; }
      .gate-error {
        display: none;
        background: #FDF0F0; border: 1.5px solid #C0392B; color: #7A1024;
        border-radius: var(--eo-radius-sm);
        padding: 0.7rem 1rem; font-size: 0.92rem; margin-bottom: 1rem;
      }
      .gate-error.show { display: block; }
      .gate-form { display: flex; flex-direction: column; gap: 0.9rem; text-align: left; }
    </style>
  </head>
  <body data-page="gate">
    <main id="main" class="gate-wrap">
      <div class="card card--flat form-shell gate-card">
        <span class="brand-lockup" aria-hidden="true">
          <svg class="brand-lockup__mark" viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="10" width="22" height="120" fill="#9FCF67"/>
            <rect x="52" y="10" width="22" height="120" fill="#9FCF67"/>
            <rect x="120" y="22" width="120" height="32" fill="#5A3F99"/>
            <rect x="120" y="88" width="120" height="32" fill="#5A3F99"/>
            <rect x="288" y="10" width="22" height="120" fill="#0093D0"/>
            <rect x="320" y="10" width="22" height="120" fill="#0093D0"/>
          </svg>
        </span>
        <span class="eyebrow">Design Preview</span>
        <h1 style="font-size:1.5rem;">Equality Ohio website preview</h1>
        <p style="color:var(--eo-mute); font-size:0.97rem;">This staging site is private. Enter the preview password to continue.</p>
        <div class="gate-error" id="gate-error" role="alert">That password isn&rsquo;t right — please try again.</div>
        <form class="gate-form" method="POST" action="/api/gate">
          <div>
            <label for="gate-password">Preview password</label>
            <input type="password" id="gate-password" name="password" autocomplete="current-password" autofocus required />
          </div>
          <input type="hidden" name="from" id="gate-from" value="/" />
          <button class="btn btn--primary" type="submit">Enter Preview</button>
        </form>
        <p class="hint mt-1" style="text-align:center;">Prepared by Joseph Carter Group for Equality Ohio.</p>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('error')) document.getElementById('gate-error').classList.add('show');
        var from = params.get('from') || '/';
        if (from.charAt(0) === '/' && from.charAt(1) !== '/') {
          document.getElementById('gate-from').value = from;
        }
      })();
    </script>
  </body>
</html>
