  <body data-page="gate">
    <main id="main" class="gate-wrap">
      <div class="card card--flat form-shell gate-card">
        <img class="gate-card__logo" src="/assets/logo/equality-ohio-logo.png" alt="Equality Ohio" width="400" height="174" />
        <span class="eyebrow">Design Preview</span>
        <h1 class="gate-card__title">Equality Ohio website preview</h1>
        <p class="gate-card__lede">This staging site is private. Enter the preview password to continue.</p>
        <div class="gate-error" id="gate-error" role="alert">That password isn&rsquo;t right — please try again.</div>
        <div class="gate-error" id="gate-error-rate" role="alert">Too many attempts from this connection. Please wait 15 minutes, then try again.</div>
        <form class="gate-form" method="POST" action="/api/gate">
          <div>
            <label for="gate-password">Preview password</label>
            <input type="password" id="gate-password" name="password" autocomplete="current-password" autofocus required />
          </div>
          <input type="hidden" name="from" id="gate-from" value="/" />
          <button class="btn btn--primary" type="submit">Enter Preview</button>
        </form>
        <p class="hint mt-1 center">Prepared by Joseph Carter Group for Equality Ohio.</p>
      </div>
    </main>
    <script src="/js/eo-gate.js" defer></script>
  </body>
